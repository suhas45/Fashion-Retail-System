<template>
    <div class="exchange-card">

        <div class="success-icon">
            <svg
                viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg"
                aria-hidden="true"
            >
                <path
                    d="M5 13l4 4L19 7"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.4"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                ></path>
            </svg>
        </div>

        <div class="message">
            Your exchange has been initiated for
            <span class="product-name">{newProduct}</span>
            <template if:true={newVariant}>
                <span class="variant">({newVariant})</span>
            </template>
        </div>

        <template if:true={exchangeNumber}>
            <div class="exchange-number-badge">
                Exchange {exchangeNumber}
            </div>
        </template>

    </div>
</template>
