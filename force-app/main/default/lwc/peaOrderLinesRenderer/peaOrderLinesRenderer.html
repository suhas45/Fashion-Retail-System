<template>
    <div class="orders-card">

        <!-- Header -->
        <div class="orders-header">
            <div class="header-icon">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path
                        d="M6 8h12l1.2 12.1c.06.6-.42 1.1-1.02 1.1H5.82c-.6 0-1.08-.5-1.02-1.1L6 8Z"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.6"
                        stroke-linejoin="round"
                    ></path>
                    <path
                        d="M9 8V6a3 3 0 0 1 6 0v2"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.6"
                        stroke-linecap="round"
                    ></path>
                </svg>
            </div>

            <div class="header-text">
                <div class="header-title">My Orders</div>
                <div class="header-subtitle">{ordersFoundLabel}</div>
            </div>
        </div>

        <!-- Orders -->
        <template if:true={hasOrders}>
            <template
                for:each={orders}
                for:item="order"
            >
                <div
                    class="order-group"
                    key={order.key}
                >

                    <!-- Order header -->
                    <div class="order-group-header">
                        <span class="order-number">Order {order.orderNumber}</span>
                        <span class="order-date">{order.displayOrderDate}</span>
                    </div>

                    <!-- Order lines -->
                    <div class="order-lines">

                        <template
                            for:each={order.lines}
                            for:item="line"
                        >
                            <div
                                class="order-line"
                                key={line.key}
                            >

                                <!-- Selection Number -->
                                <div class="selection-number">
                                    {line.selectionNumber}
                                </div>

                                <!-- Product Image -->
                                <div class="product-image">
                                    <template if:true={line.hasProductImage}>
                                        <img
                                            src={line.productImageUrl}
                                            alt={line.displaySkuName}
                                        />
                                    </template>
                                </div>

                                <!-- Product -->
                                <div class="product-info">
                                    <div class="product-name">
                                        {line.displaySkuName}
                                    </div>
                                </div>

                                <!-- Price -->
                                <div class="product-price">
                                    {line.displayPrice}
                                </div>

                                <!-- Exchange -->
                                <button
                                    class="exchange-button"
                                    data-prompt={line.exchangePrompt}
                                    onclick={handleExchangeClick}
                                    type="button"
                                >Exchange</button>

                            </div>
                        </template>

                    </div>
                </div>
            </template>

            <!-- Hint -->
            <div class="selection-hint">
                Tap Exchange on an item, or type its number (e.g. 1).
            </div>
        </template>

        <!-- Empty State -->
        <template if:false={hasOrders}>
            <div class="empty-state">
                No orders found
            </div>
        </template>

    </div>
</template>
